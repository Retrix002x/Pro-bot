<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Something went wrong</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d0d14; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; max-width: 420px; padding: 2rem; }
    a.button { display: inline-block; margin-top: 1.5rem; background: #7c3aed; color: white; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Something went wrong</h1>
    <p>{{ message }}</p>
    <a class="button" href="/start">Start again</a>
  </div>
</body>
</html>
